<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Public visual fixture: mobile RTL controls</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 390px; height: 720px; margin: 0; overflow: hidden; }
      body { background: #f4f0ff; color: #21173a; font-family: Arial, "Noto Sans Arabic", sans-serif; }
      main { position: absolute; left: 12px; top: 12px; width: 366px; height: 696px; border: 1px solid #c9bee7; border-radius: 18px; background: white; }
      h1 { position: absolute; left: 18px; top: 16px; width: 330px; margin: 0; font-size: 23px; line-height: 30px; text-align: right; }
      .instruction { position: absolute; left: 18px; top: 52px; width: 330px; margin: 0; font-size: 14px; line-height: 20px; text-align: right; }
      .question { position: absolute; left: 18px; width: 330px; margin: 0; font-size: 17px; font-weight: 700; line-height: 24px; text-align: right; }
      .q1 { top: 92px; }
      .q2 { top: 238px; }
      .q3 { top: 384px; }
      .choices { position: absolute; left: 18px; width: 330px; display: grid; gap: 8px; }
      .choices.one { top: 124px; }
      .choices.two { top: 270px; }
      .choice { height: 48px; padding: 12px 42px 10px 12px; border: 1px solid #9d8fc5; border-radius: 10px; font-size: 16px; line-height: 24px; }
      .mark { position: absolute; right: 13px; width: 20px; height: 20px; border: 2px solid #67558f; border-radius: 50%; background: white; }
      .picked .mark { border: 5px solid #5d35c7; }
      input[type="text"] { position: absolute; left: 18px; top: 416px; width: 330px; height: 48px; padding: 10px 14px; border: 1px solid #7c6ca5; border-radius: 10px; font-size: 15px; text-align: right; }
      .progress { position: absolute; left: 18px; top: 482px; width: 330px; margin: 0; color: #65577e; font-size: 13px; line-height: 20px; text-align: right; }
      .validation { position: absolute; left: 18px; top: 516px; width: 330px; margin: 0; color: #a3243b; font-size: 14px; line-height: 20px; text-align: right; }
      nav { position: absolute; left: 18px; bottom: 18px; width: 330px; height: 46px; direction: ltr; }
      button { height: 46px; border: 1px solid #5d35c7; border-radius: 12px; background: white; color: #362164; }
      .icon { position: absolute; left: 0; top: 0; width: 48px; padding: 0; }
      .icon svg { width: 22px; height: 22px; vertical-align: middle; }
      .submit { position: absolute; right: 0; top: 0; width: 112px; background: #5d35c7; color: white; font-size: 15px; }
    </style>
  </head>
  <body>
    <main>
      <h1>تفاصيل الرحلة</h1>
      <p class="instruction">اختر الإجابة الظاهرة لكل سؤال.</p>

      <p class="question q1">هل تحتاج إلى موقف سيارة؟</p>
      <div class="choices one">
        <div class="choice picked"><span class="mark"></span>نعم</div>
        <div class="choice"><span class="mark"></span>لا</div>
      </div>

      <p class="question q2">هل تريد رسالة تذكير؟</p>
      <div class="choices two">
        <div class="choice"><span class="mark"></span>نعم</div>
        <div class="choice picked"><span class="mark"></span>لا</div>
      </div>

      <label class="question q3" for="city">ما المدينة؟</label>
      <input id="city" type="text" placeholder="اكتب المدينة" />
      <p class="progress">الخطوة ٢ من ٣</p>
      <p class="validation">يرجى إدخال مدينة قبل المتابعة.</p>

      <nav aria-label="Survey navigation">
        <button class="icon" type="button" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="submit" type="button">متابعة</button>
      </nav>
    </main>
  </body>
</html>
